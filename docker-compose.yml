services:
  postgres:
    image: postgres:16-alpine
    container_name: gestorcitas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestorcitas
      POSTGRES_USER: gestorcitas
      POSTGRES_PASSWORD: gestorcitas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestorcitas -d gestorcitas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
